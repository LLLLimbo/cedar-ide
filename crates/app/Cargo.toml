[package]
name = "cedar-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Nonshipping, ignored Windows agent/JDT editor acceptance only.
windows-language-validation = ["cedar-workspace/windows-language-validation"]

[[bin]]
name = "cedar"
path = "src/main.rs"

[dependencies]
cedar-protocol = { path = "../protocol" }
cedar-client = { path = "../client" }
cedar-recovery = { path = "../recovery" }
cedar-tasks = { path = "../tasks" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde_json.workspace = true
serde.workspace = true
ab_glyph = "=0.2.32"
ttf-parser = "=0.25.1"

[dev-dependencies]
cedar-workspace = { path = "../workspace" }
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
url = "2.5"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
