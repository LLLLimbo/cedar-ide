[package]
name = "cedar-client"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
fixtures = []
[dependencies]
cedar-protocol = { path = "../protocol" }
cedar-workspace = { path = "../workspace" }
[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
cedar-tasks = { path = "../tasks" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "cedar-client-bundle-probe"
path = "tests/support/bundle_probe.rs"
required-features = ["fixtures"]

[[test]]
name = "windows_tasks"
path = "tests/windows_tasks.rs"
required-features = ["fixtures"]
