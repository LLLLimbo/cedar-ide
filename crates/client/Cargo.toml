[package]
name = "cedar-client"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
fixtures = []
windows-language-validation = ["fixtures", "cedar-workspace/windows-language-validation"]
[dependencies]
cedar-protocol = { path = "../protocol" }
cedar-workspace = { path = "../workspace" }
[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
cedar-tasks = { path = "../tasks" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[[bin]]
name = "cedar-client-transport-peer"
path = "tests/fixtures/transport_peer.rs"
required-features = ["fixtures"]

[[test]]
name = "cancellation"
path = "tests/cancellation.rs"
required-features = ["fixtures"]

[[test]]
name = "cancellation_resources"
path = "tests/cancellation_resources.rs"
required-features = ["fixtures"]

[[bin]]
name = "cedar-client-bundle-probe"
path = "tests/support/bundle_probe.rs"
required-features = ["fixtures"]

[[test]]
name = "windows_agent_language"
path = "tests/windows_agent_language.rs"
required-features = ["windows-language-validation"]

[[test]]
name = "windows_tasks"
path = "tests/windows_tasks.rs"
required-features = ["fixtures"]
