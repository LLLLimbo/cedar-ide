[package]
name = "cedar-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Nonshipping acceptance fixture only; normal constructors never use this path.
windows-language-validation = ["dep:windows-sys"]

[dependencies]
cedar-language = { path = "../language" }
cedar-tasks = { path = "../tasks" }
serde_json.workspace = true
url = "2.5"
cedar-protocol = { path = "../protocol" }
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
