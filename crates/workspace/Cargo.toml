[package]
name = "cedar-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Nonshipping acceptance fixture only; normal constructors never use this path.
windows-language-validation = []
# Fixed, nonshipping GC evidence only; independent of language-validation hooks.
windows-java-gc-diagnostic = []

[dependencies]
cedar-language = { path = "../language" }
cedar-tasks = { path = "../tasks" }
serde_json.workspace = true
url = "2.5"
cedar-protocol = { path = "../protocol" }
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
cedar-winprocess = { path = "../winprocess" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading"] }
