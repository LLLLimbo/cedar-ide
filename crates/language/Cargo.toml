[package]
name = "cedar-language"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
cedar-winprocess = { path = "../winprocess" }
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "cedar-mock-lsp"
path = "tests/support/mock_lsp.rs"
required-features = ["test-server"]

[features]
# A deterministic protocol fixture, never needed in production builds.
test-server = ["dep:windows-sys"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
