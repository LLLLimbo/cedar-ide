name: verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native Windows environment lookup contract
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python scripts/windows_environment_contract.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python scripts/test_public_export.py
      - run: python scripts/test_windows_bundle.py
      - run: python scripts/test_java_crash_collection.py
      - run: python scripts/test_process_tree_baseline.py
      - run: python scripts/test_gc_control_collection.py
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
        timeout-minutes: 15
      - run: cargo build --release --workspace --all-features --locked
      - name: Connection cancellation (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_CONNECTION_CANCEL_PEER_BIN="$PWD/target/release/cedar-client-transport-peer" cargo test -p cedar-app --lib connection_cancel_tests --locked -- --ignored --test-threads=1
      - name: Connection cancellation (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_CONNECTION_CANCEL_PEER_BIN = "$PWD/target/release/cedar-client-transport-peer.exe"
          cargo test -p cedar-app --lib connection_cancel_tests --locked -- --ignored --test-threads=1
      - name: Interrupted save reconciliation (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_INTERRUPTED_SAVE_AGENT_BIN="$PWD/target/release/cedar-agent-interrupted-save-validation" cargo test -p cedar-app --lib interrupted_save_process_tests --locked -- --ignored --test-threads=1
      - name: Interrupted save reconciliation (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_INTERRUPTED_SAVE_AGENT_BIN = "$PWD/target/release/cedar-agent-interrupted-save-validation.exe"
          cargo test -p cedar-app --lib interrupted_save_process_tests --locked -- --ignored --test-threads=1
      - name: Process integration (Unix)
        if: runner.os != 'Windows'
        run: CEDAR_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-client --test stdio_roundtrip --locked -- --ignored
      - name: Process integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-client --test stdio_roundtrip --locked -- --ignored
      - name: Windows owned-process primitives (isolated fixtures)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_WINPROCESS_FIXTURE_BIN = "$PWD/target/release/cedar-winprocess-fixture.exe"
          cargo test -p cedar-winprocess --features fixtures --test windows_lifecycle --locked -- --ignored --test-threads=1
      - name: Windows owned language transport (isolated fixtures)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test -p cedar-language --all-features --test windows_transport --locked -- --ignored --test-threads=1
      - name: Windows isolated-agent tasks and bundled Local
        timeout-minutes: 8
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_WINPROCESS_FIXTURE_BIN = "$PWD/target/release/cedar-winprocess-fixture.exe"
          $env:CEDAR_CLIENT_BUNDLE_PROBE_BIN = "$PWD/target/release/cedar-client-bundle-probe.exe"
          cargo test -p cedar-client --features fixtures --test windows_tasks --locked -- --ignored --test-threads=1
      - name: Windows agent language validation (nonshipping opt-in host)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_AGENT_LANGUAGE_VALIDATION_BIN = "$PWD/target/release/cedar-agent-language-validation.exe"
          $env:CEDAR_MOCK_LSP_BIN = "$PWD/target/release/cedar-mock-lsp.exe"
          $env:CEDAR_WINPROCESS_FIXTURE_BIN = "$PWD/target/release/cedar-winprocess-fixture.exe"
          cargo test -p cedar-client --features windows-language-validation --test windows_agent_language --locked -- --ignored --test-threads=1
      - name: Real Windows Java transport and agent/editor acceptance
        timeout-minutes: 12
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_java_acceptance.ps1
      - name: Windows Java acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-java-acceptance-evidence
          path: |
            ${{ runner.temp }}/cedar-windows-java-acceptance.txt
            ${{ runner.temp }}/cedar-java-crash-diagnostics.json
            ${{ runner.temp }}/cedar-process-tree-baseline.json
            ${{ runner.temp }}/cedar-java-long-idle-trial-1.json
            ${{ runner.temp }}/cedar-java-long-idle-trial-2.json
            ${{ runner.temp }}/cedar-java-long-idle-acceptance-1.json
            ${{ runner.temp }}/cedar-java-long-idle-acceptance-2.json
            ${{ runner.temp }}/cedar-java-long-idle-comparison.json
            ${{ runner.temp }}/cedar-java-gc-control-resources.json
            ${{ runner.temp }}/cedar-java-gc-control-acceptance.json
            ${{ runner.temp }}/cedar-java-gc-control-numeric.json
          if-no-files-found: ignore
      - name: Agent and tool protocol chains (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/protocol_smoke.py target/release/cedar-agent
          python3 scripts/capability_smoke.py target/release/cedar-agent
          python3 scripts/language_bridge_smoke.py target/release/cedar-agent target/release/cedar-mock-lsp
          python3 scripts/task_bridge_smoke.py target/release/cedar-agent
          cargo build --manifest-path examples/task-profiles-demo/Cargo.toml --offline --locked
          python3 scripts/task_profiles_smoke.py target/release/cedar-agent examples/task-profiles-demo/target/debug/cedar-task-profile-demo
      - name: Real Git changes and selected-file diff (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: python3 scripts/git_views_smoke.py --agent "$PWD/target/release/cedar-agent" --git "$(command -v git)"
      - name: Default-feature Windows shipping binaries
        if: runner.os == 'Windows'
        run: cargo build --release -p cedar-app -p cedar-agent --bin cedar --bin cedar-agent --locked
      - name: Real Git changes and selected-file diff (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $GitExecutable = (Get-Command git.exe -CommandType Application -ErrorAction Stop).Source
          python scripts/git_views_smoke.py --agent "$PWD/target/release/cedar-agent.exe" --git $GitExecutable
      - name: Verify extracted Windows development bundle
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_bundle_acceptance.ps1
      - name: Windows development ZIP and verification receipt
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cedar-windows-development
          path: |
            ${{ runner.temp }}/cedar-windows-development/*.zip
            ${{ runner.temp }}/cedar-windows-development/BUNDLE_VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cedar-${{ matrix.os }}
          path: |
            target/release/cedar
            target/release/cedar.exe
            target/release/cedar-agent
            target/release/cedar-agent.exe
            LICENSE-*
            THIRD_PARTY_NOTICES.md
            third-party-licenses/**
