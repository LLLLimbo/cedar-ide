name: verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Linux additionally runs its separately bounded Maven pair. This is job
    # orchestration headroom; no client, server or acceptance clock is renewed.
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 90 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native Windows environment lookup contract
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python scripts/windows_environment_contract.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/test_windows_fixture_compiler.py
      - name: Bind Windows fixtures to the installed Rust toolchain
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python scripts/windows_fixture_compiler.py
      - run: cargo fmt --all -- --check
      - run: python scripts/test_public_export.py
      - run: python scripts/test_capability_smoke.py
      - run: python scripts/test_linux_java_acceptance.py
      - run: python scripts/test_linux_maven_acceptance.py
      - run: python scripts/test_windows_bundle.py
      - run: python scripts/test_windows_recovery_privacy_probe.py
      - run: python scripts/test_windows_recovery_admission_witness.py
      - run: python scripts/test_linux_agent_bundle.py
      - run: python scripts/test_linux_agent_acceptance.py
      - run: python scripts/test_linux_desktop_bundle.py
      - run: python scripts/test_linux_desktop_acceptance.py
      - run: python scripts/test_git_views_smoke.py
      - run: python scripts/test_java_crash_collection.py
      - run: python scripts/test_prepare_maven_cache.py
      - run: python scripts/test_maven_acceptance.py
      - run: python scripts/test_process_tree_baseline.py
      - run: python scripts/test_gc_control_collection.py
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
        timeout-minutes: 15
      - id: release_build
        run: cargo build --release --workspace --all-features --locked
      - name: Selected-block indentation stays local (Unix, normal agent)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_BLOCK_INDENT_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib block_indent_process_tests::normal_agent_selected_block_indent_is_local_and_preserves_history --locked -- --ignored --exact --test-threads=1 --nocapture
      - name: Selected-block indentation stays local (Windows, normal agent)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_BLOCK_INDENT_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib block_indent_process_tests::normal_agent_selected_block_indent_is_local_and_preserves_history --locked -- --ignored --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Selected-block indentation process acceptance failed.' }
      - name: Enter indentation stays local (normal agent, both platforms)
        timeout-minutes: 3
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess
          import sys

          agent = pathlib.Path("target/release/cedar-agent" + (".exe" if os.name == "nt" else "")).resolve()
          if not agent.is_file():
              sys.exit("The normal release agent is missing.")
          env = dict(os.environ, CEDAR_ENTER_INDENT_AGENT_BIN=str(agent))
          result = subprocess.run(
              ["cargo", "test", "-p", "cedar-app", "--lib",
               "enter_indent_process_tests::normal_agent_enter_continuation_is_local_and_preserves_history",
               "--locked", "--", "--ignored", "--exact", "--test-threads=1", "--nocapture"],
              env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, encoding="utf-8", errors="replace", timeout=150,
          )
          print(result.stdout, end="")
          if result.returncode:
              sys.exit(result.returncode)
          if result.stdout.count("test result: ok. 1 passed; 0 failed; 0 ignored;") != 1:
              sys.exit("Exactly one Enter process acceptance test must execute.")
          receipts = []
          for line in result.stdout.splitlines():
              opening = line.find("{")
              if opening == -1:
                  continue
              try:
                  receipt = json.loads(line[opening:])
              except json.JSONDecodeError:
                  continue
              if isinstance(receipt, dict) and receipt.get("acceptance") == "enter_indent":
                  receipts.append(receipt)
          if len(receipts) != 1:
              sys.exit("Exactly one Enter process acceptance receipt is required.")
          expected = {
              "acceptance": "enter_indent", "success": True,
              "cases_executed": 42, "editor_transactions": 32,
              "connection_hellos": 1, "lists": 1, "reads": 2, "writes": 0,
              "other_operations": 0, "measured_editor_operations": 0,
              "agents_reaped": 1, "source_hashes_verified": 2,
              "trust_off": True, "production_enter_frames": True,
              "unicode_reversed_selection_affinity_preserved": True,
              "surviving_ascii_prefix_only": True, "lf_crlf_preserved": True,
              "dirty_baselines_preserved": True, "one_effective_undo_redo_preserved": True,
              "identical_text_keeps_version_and_redo": True,
              "crlf_prefix_version_refusals_preserved": True,
              "collapsed_crlf_logical_end_and_original_undo": True,
              "upper_crlf_selection_contraction_and_exact_undo": True,
              "lower_both_and_newline_only_refusals": True,
              "exact_operation_ledger_verified": True, "fixture_removed": True,
              "watchdog_joined": True, "cleanup_verified": True,
              "optional_font_probe_untriggered": True,
          }
          if receipts[0].keys() != expected.keys() or any(
              type(receipts[0].get(key)) is not type(value) or receipts[0].get(key) != value
              for key, value in expected.items()
          ):
              sys.exit("Enter process acceptance receipt did not match its fixed contract.")
      - name: Loaded Explorer file chooser (normal agent, no scanning)
        timeout-minutes: 3
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess
          import sys

          agent = pathlib.Path("target/release/cedar-agent" + (".exe" if os.name == "nt" else "")).resolve()
          if not agent.is_file():
              sys.exit("The normal release agent is missing.")
          result = subprocess.run(
              ["cargo", "test", "-p", "cedar-app", "--lib",
               "loaded_file_process_tests::normal_agent_loaded_files_chooser_is_local_bounded_and_preserves_dirty_editor",
               "--locked", "--", "--ignored", "--exact", "--test-threads=1", "--nocapture"],
              env=dict(os.environ, CEDAR_LOADED_FILES_AGENT_BIN=str(agent)),
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, encoding="utf-8", errors="replace", timeout=150,
          )
          print(result.stdout, end="")
          if result.returncode:
              sys.exit(result.returncode)
          if result.stdout.count("test result: ok. 1 passed; 0 failed; 0 ignored;") != 1:
              sys.exit("Exactly one loaded-files process acceptance must execute.")
          receipts = []
          for line in result.stdout.splitlines():
              opening = line.find("{")
              if opening < 0:
                  continue
              try:
                  receipt = json.loads(line[opening:])
              except json.JSONDecodeError:
                  continue
              if isinstance(receipt, dict) and receipt.get("acceptance") == "loaded_files":
                  receipts.append(receipt)
          expected = {'acceptance': 'loaded_files', 'success': True, 'cases_executed': 10, 'lists': 6, 'reads': 2, 'writes': 0, 'other_operations': 0, 'connections': 2, 'agents_reaped': 2, 'source_hashes_verified': 5, 'setup_lists': 6, 'setup_reads': 1, 'chooser_reads': 1, 'chooser_lists': 0, 'dirty_buffer_reads': 0, 'watchdog_seconds': 60, 'cleanup_observation_seconds': 5, 'trust_off': True, 'explicit_branch_ledger_verified': True, 'current_scope_default': True, 'keyboard_scope_filter_enter': True, 'scope_and_filter_dispatched_nothing': True, 'unloaded_descendant_not_scanned': True, 'no_match_enter_did_not_read': True, 'late_cache_did_not_retarget': True, 'collapsed_candidate_did_not_read': True, 'mode_change_rejected_old_dialog': True, 'reconnect_rejected_old_dialog': True, 'dirty_document_and_full_selection_retained': True, 'undo_redo_retained': True, 'fixture_removed': True, 'watchdog_joined': True, 'cleanup_verified': True, 'optional_font_probe_untriggered': True}
          if len(receipts) != 1 or receipts[0].keys() != expected.keys() or any(
              type(receipts[0].get(key)) is not type(value) or receipts[0].get(key) != value
              for key, value in expected.items()
          ):
              sys.exit("Loaded-files process receipt did not match its fixed contract.")
      - name: Explicit test-report reads (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_TEST_REPORT_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib test_report_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Explicit test-report reads (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_TEST_REPORT_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib test_report_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Explicit lazy Explorer tree (Unix, normal agent)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_EXPLORER_TREE_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib explorer_tree_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Explicit lazy Explorer tree (Windows, normal agent)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_EXPLORER_TREE_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib explorer_tree_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Pure SSH preflight preserves owned connection (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_SSH_PREFLIGHT_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib ssh_preflight_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Pure SSH preflight preserves owned connection (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_SSH_PREFLIGHT_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib ssh_preflight_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Explicit idle Disconnect (Unix, normal agent and controlled peer)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_EXPLICIT_DISCONNECT_AGENT_BIN="$PWD/target/release/cedar-agent" CEDAR_EXPLICIT_DISCONNECT_PEER_BIN="$PWD/target/release/cedar-client-transport-peer" cargo test -p cedar-app --lib explicit_disconnect_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Explicit idle Disconnect (Windows, normal agent and controlled peer)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_EXPLICIT_DISCONNECT_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_EXPLICIT_DISCONNECT_PEER_BIN = "$PWD/target/release/cedar-client-transport-peer.exe"
          cargo test -p cedar-app --lib explicit_disconnect_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Open-buffer Back and Forward (Unix, normal agent)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_LOCATION_HISTORY_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib location_history_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Open-buffer Back and Forward (Windows, normal agent)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_LOCATION_HISTORY_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib location_history_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Explicit draft merge (Unix, normal agent)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_DISK_MERGE_AGENT_BIN="$PWD/target/release/cedar-agent" CEDAR_DISK_MERGE_PEER_BIN="$PWD/target/release/cedar-client-transport-peer" cargo test -p cedar-app --lib disk_merge_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Explicit draft merge (Windows, normal agent)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_DISK_MERGE_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_DISK_MERGE_PEER_BIN = "$PWD/target/release/cedar-client-transport-peer.exe"
          cargo test -p cedar-app --lib disk_merge_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Passive idle disconnect (Unix, normal agent)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_IDLE_DISCONNECT_AGENT_BIN="$PWD/target/release/cedar-agent" CEDAR_IDLE_DISCONNECT_PEER_BIN="$PWD/target/release/cedar-client-transport-peer" cargo test -p cedar-app --lib idle_disconnect_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Passive idle disconnect (Windows, normal agent)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_IDLE_DISCONNECT_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_IDLE_DISCONNECT_PEER_BIN = "$PWD/target/release/cedar-client-transport-peer.exe"
          cargo test -p cedar-app --lib idle_disconnect_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Connection cancellation (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_CONNECTION_CANCEL_PEER_BIN="$PWD/target/release/cedar-client-transport-peer" cargo test -p cedar-app --lib connection_cancel_tests --locked -- --ignored --test-threads=1
      - name: Connection cancellation (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_CONNECTION_CANCEL_PEER_BIN = "$PWD/target/release/cedar-client-transport-peer.exe"
          cargo test -p cedar-app --lib connection_cancel_tests --locked -- --ignored --test-threads=1
      - name: Interrupted save reconciliation (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_INTERRUPTED_SAVE_AGENT_BIN="$PWD/target/release/cedar-agent-interrupted-save-validation" cargo test -p cedar-app --lib interrupted_save_process_tests --locked -- --ignored --test-threads=1
      - name: Interrupted save reconciliation (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_INTERRUPTED_SAVE_AGENT_BIN = "$PWD/target/release/cedar-agent-interrupted-save-validation.exe"
          cargo test -p cedar-app --lib interrupted_save_process_tests --locked -- --ignored --test-threads=1
      - name: Save acknowledgement protection (Unix, controlled peer and normal agent)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_INTERRUPTED_SAVE_AGENT_BIN="$PWD/target/release/cedar-agent-interrupted-save-validation" CEDAR_SAVE_ACK_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib save_ack_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Save acknowledgement protection (Windows, controlled peer and normal agent)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_INTERRUPTED_SAVE_AGENT_BIN = "$PWD/target/release/cedar-agent-interrupted-save-validation.exe"
          $env:CEDAR_SAVE_ACK_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib save_ack_process_tests --locked -- --ignored --test-threads=1 --nocapture
      - name: Save All second-write faults (Unix, controlled peer)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: CEDAR_INTERRUPTED_SAVE_AGENT_BIN="$PWD/target/release/cedar-agent-interrupted-save-validation" cargo test -p cedar-app --lib save_all_process_tests::controlled_ --locked -- --ignored --test-threads=1 --nocapture
      - name: Save All second-write faults (Windows, controlled peer)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_INTERRUPTED_SAVE_AGENT_BIN = "$PWD/target/release/cedar-agent-interrupted-save-validation.exe"
          cargo test -p cedar-app --lib save_all_process_tests::controlled_ --locked -- --ignored --test-threads=1 --nocapture
      - name: Process integration (Unix)
        if: runner.os != 'Windows'
        run: CEDAR_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-client --test stdio_roundtrip --locked -- --ignored
      - name: Process integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-client --test stdio_roundtrip --locked -- --ignored
      - name: Real javac build locations (Unix, synthetic workspace)
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: |
          unset JDK_JAVA_OPTIONS JDK_JAVAC_OPTIONS JAVA_TOOL_OPTIONS _JAVA_OPTIONS CLASSPATH
          test -n "${JAVA_HOME_21_X64:-}"
          export CEDAR_AGENT_BIN="$PWD/target/release/cedar-agent"
          export CEDAR_JAVAC_BIN="$JAVA_HOME_21_X64/bin/javac"
          cargo test -p cedar-app --lib build_problem_process_tests::real_javac_run_extract_read_navigation_preserves_draft_history --locked -- --ignored --exact --nocapture --test-threads=1
      - name: Real javac build locations (Windows, synthetic workspace)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          foreach ($name in @('JDK_JAVA_OPTIONS', 'JDK_JAVAC_OPTIONS', 'JAVA_TOOL_OPTIONS', '_JAVA_OPTIONS', 'CLASSPATH')) {
            $path = 'Env:' + $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }
          }
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME_21_X64)) { throw 'Runner JDK 21 installation is missing.' }
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_JAVAC_BIN = Join-Path $env:JAVA_HOME_21_X64 'bin/javac.exe'
          cargo test -p cedar-app --lib build_problem_process_tests::real_javac_run_extract_read_navigation_preserves_draft_history --locked -- --ignored --exact --nocapture --test-threads=1
      - name: Windows owned-process primitives (isolated fixtures)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_WINPROCESS_FIXTURE_BIN = "$PWD/target/release/cedar-winprocess-fixture.exe"
          cargo test -p cedar-winprocess --features fixtures --test windows_lifecycle --locked -- --ignored --test-threads=1
      - name: Windows owned language transport (isolated fixtures)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test -p cedar-language --all-features --test windows_transport --locked -- --ignored --test-threads=1
      - name: Windows isolated-agent tasks and bundled Local
        timeout-minutes: 8
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_WINPROCESS_FIXTURE_BIN = "$PWD/target/release/cedar-winprocess-fixture.exe"
          $env:CEDAR_CLIENT_BUNDLE_PROBE_BIN = "$PWD/target/release/cedar-client-bundle-probe.exe"
          cargo test -p cedar-client --features fixtures --test windows_tasks --locked -- --ignored --test-threads=1
      - name: Windows agent language validation (nonshipping opt-in host)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_AGENT_LANGUAGE_VALIDATION_BIN = "$PWD/target/release/cedar-agent-language-validation.exe"
          $env:CEDAR_MOCK_LSP_BIN = "$PWD/target/release/cedar-mock-lsp.exe"
          $env:CEDAR_WINPROCESS_FIXTURE_BIN = "$PWD/target/release/cedar-winprocess-fixture.exe"
          cargo test -p cedar-client --features windows-language-validation --test windows_agent_language --locked -- --ignored --test-threads=1
      - name: Real Windows Java transport and agent/editor acceptance
        timeout-minutes: 12
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_java_acceptance.ps1
      - name: Windows Java acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-java-acceptance-evidence
          path: |
            ${{ runner.temp }}/cedar-windows-java-acceptance.txt
            ${{ runner.temp }}/cedar-java-crash-diagnostics.json
            ${{ runner.temp }}/cedar-process-tree-baseline.json
            ${{ runner.temp }}/cedar-java-long-idle-trial-1.json
            ${{ runner.temp }}/cedar-java-long-idle-trial-2.json
            ${{ runner.temp }}/cedar-java-long-idle-acceptance-1.json
            ${{ runner.temp }}/cedar-java-long-idle-acceptance-2.json
            ${{ runner.temp }}/cedar-java-long-idle-comparison.json
            ${{ runner.temp }}/cedar-java-gc-control-resources.json
            ${{ runner.temp }}/cedar-java-gc-control-acceptance.json
            ${{ runner.temp }}/cedar-java-gc-control-numeric.json
          if-no-files-found: ignore
      - name: Real Windows Maven leaf production acceptance
        timeout-minutes: 14
        if: always() && !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success'
        shell: pwsh
        run: ./scripts/windows_java_acceptance.ps1 -MavenOnly
      - name: Windows Maven acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-maven-acceptance-evidence
          path: |
            ${{ runner.temp }}/cedar-windows-maven-acceptance.txt
            ${{ runner.temp }}/cedar-maven-crash-diagnostics.json
          if-no-files-found: ignore
      - name: Agent and tool protocol chains (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/protocol_smoke.py target/release/cedar-agent
          python3 scripts/capability_smoke.py target/release/cedar-agent
          python3 scripts/language_bridge_smoke.py target/release/cedar-agent target/release/cedar-mock-lsp
          python3 scripts/task_bridge_smoke.py target/release/cedar-agent
          cargo build --manifest-path examples/task-profiles-demo/Cargo.toml --offline --locked
          python3 scripts/task_profiles_smoke.py target/release/cedar-agent examples/task-profiles-demo/target/debug/cedar-task-profile-demo
      - name: Real Git changes and selected-file diff (Unix)
        timeout-minutes: 3
        if: runner.os != 'Windows'
        run: python3 scripts/git_views_smoke.py --agent "$PWD/target/release/cedar-agent" --git "$(command -v git)"
      - name: Default-feature Linux shipping desktop and agent
        id: linux_agent_shipping
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p cedar-app -p cedar-agent --bin cedar --bin cedar-agent --locked
          sha256sum target/release/cedar target/release/cedar-agent > "$RUNNER_TEMP/cedar-linux-default-pair.sha256"
      - name: Shipping Linux Save All (normal agent, trust off)
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          CEDAR_SAVE_ALL_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib save_all_process_tests::normal_agent_ --locked -- --ignored --test-threads=1 --nocapture
          sha256sum --check "$RUNNER_TEMP/cedar-linux-default-pair.sha256"
      - name: Shipping Linux saves with unavailable recovery (normal agent, trust off)
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          CEDAR_UNAVAILABLE_RECOVERY_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-app --lib unavailable_recovery_process_tests::normal_agent_save_and_save_all_preserve_editor_when_recovery_is_unavailable --locked -- --ignored --exact --test-threads=1 --nocapture
          sha256sum --check "$RUNNER_TEMP/cedar-linux-default-pair.sha256"
      - name: Linux generic language ownership (normal shipping agent)
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: CEDAR_AGENT_BIN="$PWD/target/release/cedar-agent" CEDAR_MOCK_LSP_BIN="$PWD/target/release/cedar-mock-lsp" cargo test -p cedar-client --test linux_agent_language --locked -- --ignored --test-threads=1 --nocapture
      - name: Real Linux typed Java (normal shipping agent)
        timeout-minutes: 28
        if: runner.os == 'Linux'
        run: python3 scripts/linux_java_acceptance.py --scratch-root "$RUNNER_TEMP" --java "$JAVA_HOME_21_X64/bin/java" --agent "$PWD/target/release/cedar-agent"
      - name: Linux typed Java sanitized acceptance receipt
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-java-acceptance-evidence
          path: ${{ runner.temp }}/LINUX_JAVA_ACCEPTANCE.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Prepare frozen Linux Maven fixture cache
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 scripts/prepare_maven_cache.py --destination "$RUNNER_TEMP/cedar-linux-maven-cache"
      - name: Real Linux Maven leaf pair (normal shipping agent)
        if: runner.os == 'Linux'
        # 180s archive + 240s cache verification + 600s compile + 15s selection
        # + 1020s runtime watchdog, with bounded process observation overhead.
        timeout-minutes: 35
        run: python3 scripts/linux_maven_acceptance.py --scratch-root "$RUNNER_TEMP" --java "$JAVA_HOME_21_X64/bin/java" --agent "$PWD/target/release/cedar-agent" --cache "$RUNNER_TEMP/cedar-linux-maven-cache"
      - name: Linux Maven sanitized acceptance receipt
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-maven-acceptance-evidence
          path: ${{ runner.temp }}/LINUX_MAVEN_ACCEPTANCE.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify extracted Ubuntu 24.04 amd64 agent bundle
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: python3 scripts/linux_agent_bundle_acceptance.py
      - name: Linux agent development archive and verification receipt
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cedar-linux-agent-development
          path: |
            ${{ runner.temp }}/cedar-linux-agent-development/*.tar.gz
            ${{ runner.temp }}/cedar-linux-agent-development/BUNDLE_VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
      - name: Build nonshipping Linux sibling-route probe
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p cedar-client --features fixtures --bin cedar-client-bundle-probe --locked
          sha256sum --check "$RUNNER_TEMP/cedar-linux-default-pair.sha256"
      - name: Verify extracted Ubuntu 24.04 amd64 desktop bundle
        timeout-minutes: 7
        if: runner.os == 'Linux'
        run: python3 scripts/linux_desktop_bundle_acceptance.py
      - name: Linux desktop development archive and verification receipt
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cedar-linux-desktop-development
          path: |
            ${{ runner.temp }}/cedar-linux-desktop-development/*.tar.gz
            ${{ runner.temp }}/cedar-linux-desktop-development/BUNDLE_VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
      - name: Default-feature Windows shipping binaries
        id: windows_shipping
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: cargo build --release -p cedar-app -p cedar-agent --bin cedar --bin cedar-agent --locked
      - name: Shipping Windows Save All (normal agent, trust off)
        timeout-minutes: 3
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_shipping.outcome == 'success' }}
        shell: pwsh
        run: |
          $AgentHash = (Get-FileHash -Algorithm SHA256 "$PWD/target/release/cedar-agent.exe").Hash
          $env:CEDAR_SAVE_ALL_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib save_all_process_tests::normal_agent_ --locked -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Save All process acceptance failed.' }
          if ((Get-FileHash -Algorithm SHA256 "$PWD/target/release/cedar-agent.exe").Hash -ne $AgentHash) {
            throw 'The default shipping agent changed during Save All acceptance.'
          }
      - name: Shipping Windows saves with unavailable recovery (normal agent, trust off)
        timeout-minutes: 3
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_shipping.outcome == 'success' }}
        shell: pwsh
        run: |
          $AgentHash = (Get-FileHash -Algorithm SHA256 "$PWD/target/release/cedar-agent.exe").Hash
          $env:CEDAR_UNAVAILABLE_RECOVERY_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib unavailable_recovery_process_tests::normal_agent_save_and_save_all_preserve_editor_when_recovery_is_unavailable --locked -- --ignored --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Unavailable recovery process acceptance failed.' }
          if ((Get-FileHash -Algorithm SHA256 "$PWD/target/release/cedar-agent.exe").Hash -ne $AgentHash) {
            throw 'The default shipping agent changed during unavailable recovery acceptance.'
          }
      - name: Real Git changes and selected-file diff (Windows)
        timeout-minutes: 3
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_shipping.outcome == 'success' }}
        shell: pwsh
        run: |
          $GitCommands = @(Get-Command git.exe -CommandType Application -ErrorAction Stop)
          if ($GitCommands.Count -lt 1) { throw 'No native Git application was found.' }
          $GitExecutable = $GitCommands[0].Source
          if ($GitExecutable -isnot [string] -or -not [IO.Path]::IsPathFullyQualified($GitExecutable)) {
            throw 'Git selection must be one absolute executable path.'
          }
          if (-not (Test-Path -LiteralPath $GitExecutable -PathType Leaf)) { throw 'Selected Git executable is missing.' }
          python scripts/git_views_smoke.py --agent "$PWD/target/release/cedar-agent.exe" --git "$GitExecutable"
      - name: Shipping Windows save acknowledgements
        timeout-minutes: 3
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_shipping.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CEDAR_SAVE_ACK_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-app --lib save_ack_process_tests::release_agent_valid_ack_adopts_only_submitted_snapshot_and_owned_recovery --locked -- --ignored --exact --test-threads=1 --nocapture
      - name: Shipping Windows explicit idle Disconnect
        timeout-minutes: 3
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_shipping.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CEDAR_EXPLICIT_DISCONNECT_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          $env:CEDAR_EXPLICIT_DISCONNECT_PEER_BIN = "$PWD/target/release/cedar-client-transport-peer.exe"
          cargo test -p cedar-app --lib explicit_disconnect_process_tests::normal_agent_explicit_disconnect_reconnect_retains_native_draft_and_recovery --locked -- --ignored --exact --test-threads=1 --nocapture
      - name: Verify extracted Windows development bundle
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_bundle_acceptance.ps1
      - name: Windows development ZIP and verification receipt
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cedar-windows-development
          path: |
            ${{ runner.temp }}/cedar-windows-development/*.zip
            ${{ runner.temp }}/cedar-windows-development/BUNDLE_VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cedar-${{ matrix.os }}
          path: |
            target/release/cedar
            target/release/cedar.exe
            target/release/cedar-agent
            target/release/cedar-agent.exe
            LICENSE-*
            THIRD_PARTY_NOTICES.md
            third-party-licenses/**
