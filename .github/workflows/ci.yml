name: verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo build --release --workspace --locked
      - name: Process integration (Unix)
        if: runner.os != 'Windows'
        run: CEDAR_AGENT_BIN="$PWD/target/release/cedar-agent" cargo test -p cedar-client --test stdio_roundtrip --locked -- --ignored
      - name: Process integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CEDAR_AGENT_BIN = "$PWD/target/release/cedar-agent.exe"
          cargo test -p cedar-client --test stdio_roundtrip --locked -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: cedar-${{ matrix.os }}
          path: |
            target/release/cedar
            target/release/cedar.exe
            target/release/cedar-agent
            target/release/cedar-agent.exe
            LICENSE-*
            THIRD_PARTY_NOTICES.md
            third-party-licenses/**
