[workspace]
members = ["crates/protocol", "crates/workspace", "crates/agent", "crates/client", "crates/app", "crates/language", "crates/debugger", "crates/recovery", "crates/tasks", "crates/winprocess"]
resolver = "2"

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
